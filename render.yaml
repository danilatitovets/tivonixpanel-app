# Tivonix Panel — single Next.js Web Service on Render Free.
# Frontend UI + /api/** live in one process (no INTERNAL_API_URL / second service).
# Database stays on Supabase. Secrets (sync: false) are set in the Dashboard.
#
# Free plan still sleeps after ~15 min idle. Custom domains do NOT prevent sleep.
# For always-on, upgrade this service to Starter in the Dashboard.

projects:
  - name: tivonixpanel
    environments:
      - name: production
        services:
          - type: web
            name: tivonixpanel-web
            runtime: node
            plan: free
            region: frankfurt
            branch: main
            buildCommand: npm ci && npm run build
            startCommand: npm run start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: HOST
                value: "0.0.0.0"
              - key: APP_SERVICE
                value: full
              - key: NEXT_PUBLIC_DEMO_MODE
                value: "false"
              - key: NEXT_PUBLIC_SUPABASE_URL
                sync: false
              - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_PUBLISHABLE_KEY
                sync: false
              - key: SUPABASE_SECRET_KEY
                sync: false
              - key: DATABASE_URL
                sync: false
              - key: ADMIN_EMAIL
                sync: false
              - key: APP_URL
                sync: false
              - key: NEXT_PUBLIC_APP_URL
                sync: false
