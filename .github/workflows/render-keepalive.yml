# Keep Render free web services from spinning down.
# Free instances sleep after ~15 minutes of no traffic.
# This pings both services every 10 minutes.
#
# Note: always-on free hours are limited monthly. For a real always-on panel,
# upgrade tivonixpanel-web + tivonixpanel-backend to Starter in the Render dashboard.

name: Render keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API and frontend
        run: |
          set -e
          ping() {
            url="$1"
            echo "GET $url"
            # Follow redirects; tolerate slow cold starts up to ~90s
            code=$(curl -sS -o /tmp/keepalive-body -w "%{http_code}" \
              --connect-timeout 20 --max-time 90 "$url" || echo "000")
            echo "status=$code"
            head -c 200 /tmp/keepalive-body || true
            echo
            case "$code" in
              200|301|302|307|308|401|403|404) return 0 ;;
              *) return 1 ;;
            esac
          }

          fail=0
          ping "https://tivonixpanel-backend.onrender.com/api/health" || fail=1
          ping "https://tivonixpanel-web.onrender.com/login" || fail=1
          exit $fail
