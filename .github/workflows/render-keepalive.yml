# Keep the single Render Free web service warm (best-effort).
# Free instances still sleep after ~15 minutes; GitHub cron often drifts.
# Custom domains do not prevent sleep. Upgrade to Starter for always-on.

name: Render keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake unified panel
        run: |
          set -euo pipefail
          ping() {
            url="$1"
            echo "GET $url"
            code=$(curl -sS -o /tmp/keepalive-body -w "%{http_code}" \
              --connect-timeout 20 --max-time 90 "$url" || echo "000")
            echo "status=$code"
            head -c 200 /tmp/keepalive-body || true
            echo
            case "$code" in
              200|301|302|307|308|401|403|404) return 0 ;;
              *) return 1 ;;
            esac
          }

          fail=0
          # Prefer custom domain; fall back to onrender URL.
          for url in \
            "https://tivonixpanel.of.by/api/health" \
            "https://tivonixpanel-web.onrender.com/api/health"
          do
            ping "$url" || fail=1
            sleep 2
            ping "$url" || fail=1
          done
          exit $fail
