# Attempt to keep Render free web services warm.
# Free instances sleep after ~15 minutes of no traffic.
#
# WARNING: GitHub Actions schedule is best-effort and often delayed by hours,
# so this alone cannot guarantee always-on. For a panel that must stay awake,
# upgrade tivonixpanel-web + tivonixpanel-backend to Starter in Render.

name: Render keepalive

on:
  schedule:
    # Every 5 minutes — GitHub may still coalesce / delay heavily.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API and frontend
        run: |
          set -euo pipefail
          ping() {
            url="$1"
            echo "GET $url"
            # Follow redirects; tolerate slow cold starts up to ~90s
            code=$(curl -sS -o /tmp/keepalive-body -w "%{http_code}" \
              --connect-timeout 20 --max-time 90 "$url" || echo "000")
            echo "status=$code"
            head -c 200 /tmp/keepalive-body || true
            echo
            case "$code" in
              200|301|302|307|308|401|403|404) return 0 ;;
              *) return 1 ;;
            esac
          }

          fail=0
          # Wake each service on its own URL. Never hit web /api/health — that used
          # to proxy into the API and 429 the panel during cold start.
          # Hit each URL twice so a cold start + first probe still leaves traffic
          # on a living process.
          for url in \
            "https://tivonixpanel-backend.onrender.com/api/health" \
            "https://tivonixpanel-web.onrender.com/login"
          do
            ping "$url" || fail=1
            sleep 2
            ping "$url" || fail=1
          done
          exit $fail
