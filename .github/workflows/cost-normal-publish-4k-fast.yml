name: Cost of Normal Final Cinematic 4K

on:
  push:
    branches: ['cost-of-normal-publish-4k-fast']
    paths:
      - '.github/workflows/cost-normal-publish-4k-fast.yml'
      - 'cost-normal/manifest.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-inter

      - name: Render curated native-4K documentary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/render_final.py <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, subprocess, urllib.request

          R=Path.cwd(); M=json.loads((R/'cost-normal/manifest.json').read_text())
          for d in ['work/audio','work/video','work/segments','work/output','work/qa/frames']:
              (R/d).mkdir(parents=True, exist_ok=True)

          def run(cmd): subprocess.run(cmd,check=True)
          def dl(url,dest):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=180) as r, open(dest,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              return dest
          def vinfo(p):
              j=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-show_entries','format=duration,bit_rate','-of','json',str(p)],text=True))
              s=j['streams'][0]; f=j['format']
              return {'w':int(s['width']),'h':int(s['height']),'dur':float(f['duration']),'bitrate':int(f.get('bit_rate') or 0)}
          def adur(p): return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(p)],text=True).strip())
          def esc(t): return t.replace('\\','\\\\').replace("'","\\'").replace(':','\\:').replace('%','\\%')

          ids=[]
          for vals in M['sources'].values():
              for pid in vals:
                  if pid not in ids: ids.append(pid)

          with ThreadPoolExecutor(max_workers=10) as ex:
              jobs=[]
              for i,u in enumerate(M['audio_urls'],1): jobs.append(ex.submit(dl,u,R/f'work/audio/{i:02d}.mp3'))
              for pid in ids: jobs.append(ex.submit(dl,f'https://www.pexels.com/download/video/{pid}/',R/f'work/video/{pid}.mp4'))
              for f in as_completed(jobs): f.result()

          audios=sorted((R/'work/audio').glob('*.mp3')); assert len(audios)==28
          infos={int(p.stem):vinfo(p) for p in (R/'work/video').glob('*.mp4')}
          bad={pid:v for pid,v in infos.items() if not (v['w']>=3840 and v['h']>=2160 and v['w']>=v['h'])}
          if bad:
              raise RuntimeError(f'Non-native-4K source entered final pool: {bad}')
          (R/'work/qa/source_info.json').write_text(json.dumps(infos,indent=2))

          pools={k:[pid for pid in vals if pid in infos] for k,vals in M['sources'].items()}
          pools['data']=pools['dealer']+pools['budget']
          pools['credit']=pools['budget']+pools['dealer']
          for k,v in pools.items():
              if not v: raise RuntimeError(f'Empty visual pool {k}')

          usage={pid:0 for pid in infos}; last=None; specs=[]; cursor=0.0; scene_map=[]
          hero_scenes={4,5,6,17,21,28}
          for scene,(a,kind) in enumerate(zip(audios,M['kinds']),1):
              remain=adur(a); start_scene=cursor; shot=0; pool=pools[kind]
              while remain>0.035:
                  target=3.0 if cursor<35 else 3.8
                  if scene in hero_scenes and shot==0: target=min(5.5,remain)
                  candidates=[pid for pid in pool if pid!=last] or pool
                  candidates.sort(key=lambda pid:(usage[pid], -infos[pid]['bitrate'], -infos[pid]['dur']))
                  pid=candidates[0]; vi=infos[pid]
                  sd=min(target,remain,max(0.7,vi['dur']-0.12))
                  maxstart=max(0.0,vi['dur']-sd-0.06)
                  ss=0.0 if maxstart<=0 else (scene*2.17 + usage[pid]*7.31 + shot*3.07) % maxstart
                  specs.append({'i':len(specs)+1,'scene':scene,'kind':kind,'pid':pid,'ss':ss,'dur':sd,'hero':scene in hero_scenes and shot==0})
                  usage[pid]+=1; last=pid; cursor+=sd; remain-=sd; shot+=1
              scene_map.append({'scene':scene,'kind':kind,'start':start_scene,'end':cursor,'audio':a.name})
          (R/'work/qa/scene_map.json').write_text(json.dumps(scene_map,indent=2))
          (R/'work/qa/usage.json').write_text(json.dumps(usage,indent=2))

          font=subprocess.check_output(['fc-match','-f','%{file}','Inter'],text=True).strip()
          overlays={int(k):v for k,v in M.get('overlays',{}).items()}
          accent='0xD6AE67'; white='0xF6F3EC'; muted='0xD6D2C9'

          def render_one(s):
              src=R/f"work/video/{s['pid']}.mp4"; out=R/f"work/segments/{s['i']:03d}.mp4"
              vf='scale=3840:2160:force_original_aspect_ratio=increase,crop=3840:2160,fps=30,setsar=1,eq=contrast=1.03:saturation=0.97:brightness=-0.006'
              if s['hero']:
                  lines=overlays[s['scene']]
                  vf += ',drawbox=x=0:y=0:w=1800:h=2160:color=0x0A0D12@0.70:t=fill'
                  vf += f',drawbox=x=180:y=600:w=10:h=760:color={accent}@0.95:t=fill'
                  sizes=[126,92,70]; ys=[650,905,1135]; colors=[white,white,accent]
                  for text,size,y,color in zip(lines,sizes,ys,colors):
                      vf += f",drawtext=fontfile='{font}':text='{esc(text)}':fontcolor={color}:fontsize={size}:x=255:y={y}:shadowx=0:shadowy=0"
              run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f"{s['ss']:.3f}",'-i',str(src),'-t',f"{s['dur']:.3f}",'-an','-vf',vf,'-c:v','libx264','-preset','veryfast','-crf','18','-g','60','-keyint_min','60','-sc_threshold','0','-pix_fmt','yuv420p',str(out)])
              return out

          with ThreadPoolExecutor(max_workers=6) as ex:
              fs=[ex.submit(render_one,s) for s in specs]
              for f in as_completed(fs): f.result()

          with open(R/'work/segments/list.txt','w') as f:
              for i in range(1,len(specs)+1): f.write(f"file '{(R/f'work/segments/{i:03d}.mp4').resolve()}'\n")
          with open(R/'work/audio/list.txt','w') as f:
              for p in audios: f.write(f"file '{p.resolve()}'\n")

          visual=R/'work/output/visual4k.mp4'
          audio=R/'work/output/narration.m4a'
          master=R/'work/output/Cost_of_Normal_Monthly_Payment_Trap_FINAL_NATIVE4K.mp4'
          review=R/'work/output/Cost_of_Normal_Monthly_Payment_Trap_FINAL_REVIEW_720p.mp4'
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',str(R/'work/segments/list.txt'),'-c:v','copy','-an',str(visual)])
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',str(R/'work/audio/list.txt'),'-af','loudnorm=I=-16:LRA=6:TP=-1.5','-c:a','aac','-b:a','256k','-ar','48000',str(audio)])
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(visual),'-i',str(audio),'-map','0:v:0','-map','1:a:0','-shortest','-c:v','copy','-c:a','copy','-movflags','+faststart',str(master)])
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(master),'-vf','scale=1280:720','-c:v','libx264','-preset','veryfast','-crf','22','-pix_fmt','yuv420p','-c:a','aac','-b:a','160k','-movflags','+faststart',str(review)])
          PY
          python3 /tmp/render_final.py

      - name: Quality gate
        shell: bash
        run: |
          set -euo pipefail
          M=work/output/Cost_of_Normal_Monthly_Payment_Trap_FINAL_NATIVE4K.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json "$M" | tee work/qa/probe.json
          for t in 5 20 45 75 120 180 270 360 450 520; do ffmpeg -hide_banner -loglevel error -y -ss "$t" -i "$M" -frames:v 1 -q:v 2 "work/qa/frames/${t}.jpg"; done
          ffmpeg -hide_banner -i "$M" -vf blackdetect=d=0.5:pix_th=0.05 -an -f null - 2> work/qa/blackdetect.txt || true
          if grep -q 'black_duration:' work/qa/blackdetect.txt; then cat work/qa/blackdetect.txt; exit 1; fi
          python3 - <<'PY'
          import json
          x=json.load(open('work/qa/source_info.json'))
          bad={k:v for k,v in x.items() if not (v['w']>=3840 and v['h']>=2160)}
          if bad: raise SystemExit(f'Native-4K gate failed: {bad}')
          u=json.load(open('work/qa/usage.json'))
          used=[k for k,v in u.items() if v>0]
          if len(used)<18: raise SystemExit(f'Visual variety gate failed: {len(used)} unique sources')
          open('work/qa/final_gate.txt','w').write(f'PUBLISH_APPROVED_NATIVE4K_PENDING_VISUAL_REVIEW\nunique_sources={len(used)}\nall_sources_native4k=true\n')
          PY

      - name: Upload final review and QA
        uses: actions/upload-artifact@v4
        with:
          name: cost-normal-final-native4k-review
          path: |
            work/output/Cost_of_Normal_Monthly_Payment_Trap_FINAL_REVIEW_720p.mp4
            work/qa/probe.json
            work/qa/source_info.json
            work/qa/scene_map.json
            work/qa/usage.json
            work/qa/final_gate.txt
            work/qa/blackdetect.txt
            work/qa/frames/*.jpg
          retention-days: 7
          compression-level: 0

      - name: Upload final native-4K master
        uses: actions/upload-artifact@v4
        with:
          name: cost-normal-final-native4k-master
          path: work/output/Cost_of_Normal_Monthly_Payment_Trap_FINAL_NATIVE4K.mp4
          retention-days: 7
          compression-level: 0
