name: Cost of Normal QA Review

on:
  push:
    branches: ['cost-of-normal-turbo-final']
    paths:
      - '.github/workflows/cost-normal-qa-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl unzip

      - name: Download successful final artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10345672669/zip" \
            -o final-artifact.zip
          mkdir extracted
          unzip -q final-artifact.zip -d extracted
          find extracted -maxdepth 4 -type f -print
          MASTER=$(find extracted -type f -name '*.mp4' | head -n1)
          test -n "$MASTER"
          echo "MASTER=$MASTER" >> "$GITHUB_ENV"

      - name: Inspect master and create review assets
        run: |
          set -euo pipefail
          mkdir -p qa/frames review
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,bit_rate \
            -of json "$MASTER" | tee qa/probe.json
          for t in 5 30 75 150 270 420 520; do
            ffmpeg -hide_banner -loglevel error -y -ss "$t" -i "$MASTER" -frames:v 1 -q:v 2 "qa/frames/${t}.jpg"
          done
          ffmpeg -hide_banner -i "$MASTER" -vf blackdetect=d=0.35:pix_th=0.10 -an -f null - 2> qa/blackdetect.txt || true
          ffmpeg -hide_banner -loglevel error -y -i "$MASTER" \
            -vf "scale=1280:-2:flags=lanczos" \
            -c:v libx264 -preset veryfast -crf 29 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart \
            review/Cost_of_Normal_Monthly_Payment_Trap_REVIEW_720p.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -of json review/Cost_of_Normal_Monthly_Payment_Trap_REVIEW_720p.mp4 | tee qa/review-probe.json

      - name: Upload QA frames
        uses: actions/upload-artifact@v4
        with:
          name: cost-normal-qa-frames
          path: qa/
          retention-days: 7
          compression-level: 6

      - name: Upload lightweight review
        uses: actions/upload-artifact@v4
        with:
          name: cost-normal-review-720p
          path: review/Cost_of_Normal_Monthly_Payment_Trap_REVIEW_720p.mp4
          retention-days: 7
          compression-level: 0
