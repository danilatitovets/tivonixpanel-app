name: Cost of Normal Publish Ready 4K

on:
  push:
    branches: ['cost-of-normal-publish-4k']
    paths:
      - '.github/workflows/cost-normal-publish-4k.yml'
      - 'cost-normal/manifest.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build publish-ready 4K documentary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/render4k.py <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, subprocess, urllib.request, os, math

          R=Path.cwd(); M=json.loads((R/'cost-normal/manifest.json').read_text())
          for d in ['work/audio','work/video','work/segments','work/output','work/qa/frames']:
              (R/d).mkdir(parents=True, exist_ok=True)

          def run(cmd): subprocess.run(cmd,check=True)
          def dl(url,dest):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=180) as r,open(dest,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              return str(dest)
          def probe_video(p):
              raw=subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,r_frame_rate','-show_entries','format=duration','-of','json',str(p)],text=True)
              j=json.loads(raw); s=j['streams'][0]
              return {'w':int(s['width']),'h':int(s['height']),'dur':float(j['format']['duration']),'fps':s.get('r_frame_rate','')}
          def adur(p):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(p)],text=True).strip())
          def esc(t): return t.replace('\\','\\\\').replace("'","\\'").replace(':','\\:').replace('%','\\%')

          all_ids=[]
          for vals in M['sources'].values():
              for pid in vals:
                  if pid not in all_ids: all_ids.append(pid)

          jobs=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              for i,u in enumerate(M['audio_urls'],1): jobs.append(ex.submit(dl,u,R/f'work/audio/{i:02d}.mp3'))
              for pid in all_ids: jobs.append(ex.submit(dl,f'https://www.pexels.com/download/video/{pid}/',R/f'work/video/{pid}.mp4'))
              for f in as_completed(jobs): f.result()

          audios=sorted((R/'work/audio').glob('*.mp3'))
          assert len(audios)==28
          infos={int(p.stem):probe_video(p) for p in (R/'work/video').glob('*.mp4')}
          (R/'work/qa/source_info.json').write_text(json.dumps(infos,indent=2))

          pools={}
          for kind,ids in M['sources'].items():
              good=[pid for pid in ids if pid in infos and infos[pid]['w']>=infos[pid]['h'] and infos[pid]['w']>=1920]
              if len(good)<3: good=[pid for pid in ids if pid in infos and infos[pid]['w']>=infos[pid]['h']]
              good.sort(key=lambda pid:(infos[pid]['w']>=3840, infos[pid]['w']*infos[pid]['h'], infos[pid]['dur']),reverse=True)
              pools[kind]=good
          pools['data']=pools['dealer']+pools['budget']
          pools['credit']=pools['budget']+pools['dealer']

          usage={pid:0 for pid in infos}; last=None; specs=[]; cursor=0.0; scene_map=[]
          for scene,(a,kind) in enumerate(zip(audios,M['kinds']),1):
              dur=adur(a); remain=dur; sstart=cursor; shot=0; pool=pools[kind]
              assert pool, f'empty pool {kind}'
              while remain>0.035:
                  target=3.4 if scene<=3 else 4.0
                  if scene in [4,5,6,17,21,28] and shot==0: target=min(5.2,remain)
                  candidates=[pid for pid in pool if pid!=last] or pool
                  candidates.sort(key=lambda pid:(usage[pid], -(infos[pid]['w']>=3840), -infos[pid]['w']))
                  pid=candidates[0]; vi=infos[pid]
                  sd=min(target,remain,max(0.6,vi['dur']-0.08))
                  maxstart=max(0.0,vi['dur']-sd-0.05)
                  ss=0.0 if maxstart<=0 else (scene*1.73 + usage[pid]*5.17 + shot*2.31) % maxstart
                  specs.append({'i':len(specs)+1,'scene':scene,'kind':kind,'pid':pid,'ss':ss,'dur':sd,'global':cursor,'hero':scene in [4,5,6,17,21,28] and shot==0})
                  usage[pid]+=1; last=pid; cursor+=sd; remain-=sd; shot+=1
              scene_map.append({'scene':scene,'kind':kind,'start':sstart,'end':cursor,'audio':a.name})
          (R/'work/qa/scene_map.json').write_text(json.dumps(scene_map,indent=2))
          (R/'work/qa/usage.json').write_text(json.dumps(usage,indent=2))

          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          overlays={int(k):v for k,v in M.get('overlays',{}).items()}
          def render_one(s):
              src=R/f"work/video/{s['pid']}.mp4"; out=R/f"work/segments/{s['i']:03d}.mp4"
              vf="scale=3840:2160:force_original_aspect_ratio=increase,crop=3840:2160,fps=30,setsar=1,eq=contrast=1.05:saturation=1.04:brightness=-0.015,unsharp=5:5:0.35:3:3:0.12"
              if s['scene']==1 and s['i']==1:
                  vf += ",drawbox=x=0:y=1540:w=3840:h=620:color=black@0.25:t=fill"
                  vf += f",drawtext=fontfile={font}:text='{esc('THE MONTHLY PAYMENT TRAP')}':fontcolor=white:fontsize=112:x=190:y=1700"
              if s['hero']:
                  lines=overlays[s['scene']]
                  vf += ",drawbox=x=220:y=220:w=3400:h=1720:color=black@0.52:t=fill"
                  sizes=[132,104,82]; ys=[650,930,1195]
                  for text,size,y in zip(lines,sizes,ys):
                      vf += f",drawtext=fontfile={font}:text='{esc(text)}':fontcolor=white:fontsize={size}:x=(w-text_w)/2:y={y}"
              run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f"{s['ss']:.3f}",'-i',str(src),'-t',f"{s['dur']:.3f}",'-an','-vf',vf,'-c:v','libx264','-preset','veryfast','-crf','17','-g','60','-keyint_min','60','-sc_threshold','0','-pix_fmt','yuv420p',str(out)])
              return str(out)

          with ThreadPoolExecutor(max_workers=6) as ex:
              futs=[ex.submit(render_one,s) for s in specs]
              for f in as_completed(futs): f.result()

          with open(R/'work/segments/list.txt','w') as f:
              for i in range(1,len(specs)+1): f.write(f"file '{(R/f'work/segments/{i:03d}.mp4').resolve()}'\n")
          with open(R/'work/audio/list.txt','w') as f:
              for p in audios: f.write(f"file '{p.resolve()}'\n")

          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',str(R/'work/segments/list.txt'),'-c:v','copy','-an',str(R/'work/output/visual4k.mp4')])
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',str(R/'work/audio/list.txt'),'-af','loudnorm=I=-16:LRA=7:TP=-1.5','-c:a','aac','-b:a','256k','-ar','48000',str(R/'work/output/narration.m4a')])
          mezz=R/'work/output/mezzanine4k.mp4'
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(R/'work/output/visual4k.mp4'),'-i',str(R/'work/output/narration.m4a'),'-map','0:v:0','-map','1:a:0','-shortest','-c:v','copy','-c:a','copy','-movflags','+faststart',str(mezz)])

          master=R/'work/output/Cost_of_Normal_Monthly_Payment_Trap_PUBLISH_4K.mp4'
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(mezz),'-c:v','libx265','-preset','fast','-crf','20','-tag:v','hvc1','-pix_fmt','yuv420p10le','-c:a','copy','-movflags','+faststart',str(master)])
          review=R/'work/output/Cost_of_Normal_Monthly_Payment_Trap_REVIEW_1080p.mp4'
          run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(master),'-vf','scale=1920:1080','-c:v','libx264','-preset','fast','-crf','20','-pix_fmt','yuv420p','-c:a','aac','-b:a','160k','-movflags','+faststart',str(review)])
          print(master)
          PY
          python3 /tmp/render4k.py

      - name: Quality gate
        shell: bash
        run: |
          set -euo pipefail
          M=work/output/Cost_of_Normal_Monthly_Payment_Trap_PUBLISH_4K.mp4
          R=work/output/Cost_of_Normal_Monthly_Payment_Trap_REVIEW_1080p.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json "$M" | tee work/qa/probe_master.json
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json "$R" | tee work/qa/probe_review.json
          for t in 5 30 75 120 180 270 360 450 520; do ffmpeg -hide_banner -loglevel error -y -ss "$t" -i "$M" -frames:v 1 -q:v 2 "work/qa/frames/${t}.jpg"; done
          ffmpeg -hide_banner -i "$M" -vf blackdetect=d=0.6:pix_th=0.08 -an -f null - 2> work/qa/blackdetect.txt || true
          if grep -q 'black_duration:' work/qa/blackdetect.txt; then cat work/qa/blackdetect.txt; exit 1; fi
          python3 - <<'PY'
          import json
          info=json.load(open('work/qa/source_info.json'))
          vals=list(info.values()); native=sum(1 for v in vals if v['w']>=3840 and v['w']>=v['h'])
          open('work/qa/native_4k_summary.txt','w').write(f'native_4k_sources={native}\ntotal_sources={len(vals)}\n')
          print(open('work/qa/native_4k_summary.txt').read())
          PY

      - name: Upload review and QA
        uses: actions/upload-artifact@v4
        with:
          name: cost-normal-publish-ready-review
          path: |
            work/output/Cost_of_Normal_Monthly_Payment_Trap_REVIEW_1080p.mp4
            work/qa/probe_master.json
            work/qa/probe_review.json
            work/qa/source_info.json
            work/qa/scene_map.json
            work/qa/usage.json
            work/qa/native_4k_summary.txt
            work/qa/blackdetect.txt
            work/qa/frames/*.jpg
          retention-days: 7
          compression-level: 0

      - name: Upload 4K master
        uses: actions/upload-artifact@v4
        with:
          name: cost-normal-publish-ready-4k-master
          path: work/output/Cost_of_Normal_Monthly_Payment_Trap_PUBLISH_4K.mp4
          retention-days: 7
          compression-level: 0
