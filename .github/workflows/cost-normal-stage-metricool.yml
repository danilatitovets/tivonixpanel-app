name: Cost of Normal Stage for Metricool

on:
  push:
    branches: ['cost-of-normal-publish-4k-fast']
    paths:
      - '.github/workflows/cost-normal-stage-metricool.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-inter

      - name: Download final 4K artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stage
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/10355443006/zip > master.zip
          unzip -q master.zip -d stage
          find stage -type f -maxdepth 3 -print
          MASTER=$(find stage -type f -name '*FINAL_NATIVE4K.mp4' | head -1)
          test -n "$MASTER"
          mv "$MASTER" stage/Cost_of_Normal_Monthly_Payment_Trap_FINAL_NATIVE4K.mp4

      - name: Build compact 4K upload master and thumbnail
        run: |
          set -euo pipefail
          M=stage/Cost_of_Normal_Monthly_Payment_Trap_FINAL_NATIVE4K.mp4
          ffmpeg -hide_banner -loglevel error -y -i "$M" \
            -c:v libx264 -preset medium -crf 21 -maxrate 30M -bufsize 60M \
            -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -movflags +faststart \
            stage/Cost_of_Normal_Monthly_Payment_Trap_METRICOOL_4K.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 45 -i "$M" -frames:v 1 -vf 'scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720' stage/base.jpg
          FONT=$(fc-match -f '%{file}' Inter | head -1)
          ffmpeg -hide_banner -loglevel error -y -i stage/base.jpg -vf "drawbox=x=0:y=0:w=610:h=720:color=black@0.45:t=fill,drawtext=fontfile='$FONT':text='84 MONTHS?':fontcolor=white:fontsize=92:x=54:y=210,drawtext=fontfile='$FONT':text='SAME CAR. LONGER DEBT.':fontcolor=0xE2C27A:fontsize=34:x=58:y=330" -frames:v 1 stage/Cost_of_Normal_84_MONTHS_thumbnail.jpg
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json stage/Cost_of_Normal_Monthly_Payment_Trap_METRICOOL_4K.mp4 | tee stage/upload_probe.json

      - name: Publish temporary staging release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=cost-normal-monthly-payment-staging-v1
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'Cost of Normal staging' --notes 'Temporary staging assets for Metricool ingestion.' --target cost-of-normal-publish-4k-fast
          gh release upload "$TAG" stage/Cost_of_Normal_Monthly_Payment_Trap_METRICOOL_4K.mp4 stage/Cost_of_Normal_84_MONTHS_thumbnail.jpg stage/upload_probe.json --clobber
          echo "VIDEO_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/Cost_of_Normal_Monthly_Payment_Trap_METRICOOL_4K.mp4" | tee stage/urls.txt
          echo "THUMB_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/Cost_of_Normal_84_MONTHS_thumbnail.jpg" | tee -a stage/urls.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cost-normal-metricool-staging-info
          path: |
            stage/urls.txt
            stage/upload_probe.json
            stage/Cost_of_Normal_84_MONTHS_thumbnail.jpg
          retention-days: 7
