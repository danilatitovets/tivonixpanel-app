name: Cost of Normal Native 4K Source Audit 2
on:
  push:
    branches:
      - cost-of-normal-publish-4k-fast
    paths:
      - .github/workflows/cost-normal-source-audit2.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick
      - name: Audit trade-in value and finance source batch
        shell: bash
        run: |
          set -e
          mkdir -p clips frames out
          printf '%s\n' \
            '29555017 tradein_customer_vehicle_inspection' \
            '6817082 tradein_couple_vehicle_evaluation' \
            '7154233 tradein_formal_vehicle_inspection_documents' \
            '7154222 dealer_purchase_negotiation' \
            '7154221 dealer_couple_purchase_discussion' \
            '7154235 dealer_sales_presentation' \
            '30340591 dealership_inventory_aerial' \
            '9997960 dealership_inventory_showroom' \
            '32329374 vehicle_diagnostic_inspection' \
            '20693173 vehicle_condition_inspection' \
            '8987413 undercarriage_value_inspection' \
            '8986475 engine_value_inspection' \
            '6870342 mechanic_service_records' \
            '6870345 mechanic_vehicle_documents' \
            '8052394 finance_paperwork_in_car' \
            '8052387 finance_document_review_in_car' > candidates.txt
          echo 'id,label,width,height,duration,bitrate,native4k' > out/audit.csv
          : > out/selected_4k.txt
          while read -r vid label; do
            echo "AUDIT $vid $label"
            if ! curl -fsSL --retry 3 -A 'Mozilla/5.0' "https://www.pexels.com/download/video/${vid}/" -o "clips/${vid}.mp4"; then
              echo "$vid,$label,0,0,0,0,false" >> out/audit.csv
              continue
            fi
            W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "clips/${vid}.mp4" 2>/dev/null || echo 0)
            H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "clips/${vid}.mp4" 2>/dev/null || echo 0)
            DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "clips/${vid}.mp4" 2>/dev/null || echo 0)
            BR=$(ffprobe -v error -show_entries format=bit_rate -of default=nw=1:nk=1 "clips/${vid}.mp4" 2>/dev/null || echo 0)
            N4K=false
            if [ "${W:-0}" -ge 3840 ] && [ "${H:-0}" -ge 1900 ] && [ "${W:-0}" -gt "${H:-0}" ]; then N4K=true; fi
            echo "$vid,$label,$W,$H,$DUR,$BR,$N4K" >> out/audit.csv
            if [ "$N4K" = true ]; then
              echo "$vid $label $W $H" >> out/selected_4k.txt
              ffmpeg -hide_banner -loglevel error -y -ss 2 -i "clips/${vid}.mp4" -frames:v 1 -vf 'scale=640:-2' "frames/${vid}_${label}.jpg" || true
            fi
          done < candidates.txt
          COUNT=$(wc -l < out/selected_4k.txt | tr -d ' ')
          echo "native_4k_count=$COUNT" | tee out/summary.txt
          cat out/selected_4k.txt
          if ls frames/*.jpg >/dev/null 2>&1; then montage frames/*.jpg -thumbnail 640x360 -tile 3x -geometry +8+8 out/contact_4k.jpg; fi
          test "$COUNT" -ge 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-normal-native-4k-source-audit-2
          path: out/
          retention-days: 7
