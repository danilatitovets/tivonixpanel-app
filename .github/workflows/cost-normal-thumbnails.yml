name: Cost of Normal Thumbnail Variants

on:
  push:
    branches: ['cost-of-normal-publish-4k']
    paths:
      - '.github/workflows/cost-normal-thumbnails.yml'
  workflow_dispatch:

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build three real-footage thumbnails
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out src
          curl -fL --retry 4 -A 'Mozilla/5.0' 'https://www.pexels.com/download/video/7154231/' -o src/contract.mp4
          curl -fL --retry 4 -A 'Mozilla/5.0' 'https://www.pexels.com/download/video/7154208/' -o src/keys.mp4
          curl -fL --retry 4 -A 'Mozilla/5.0' 'https://www.pexels.com/download/video/34760693/' -o src/consult.mp4
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -hide_banner -loglevel error -y -ss 4 -i src/contract.mp4 -frames:v 1 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,eq=contrast=1.08:saturation=1.05:brightness=-0.06,drawbox=x=0:y=0:w=1280:h=720:color=black@0.16:t=fill,drawtext=fontfile=$F:text='84 MONTHS?':fontcolor=white:fontsize=118:borderw=7:bordercolor=black:x=55:y=470" -q:v 2 out/thumb_A_84_MONTHS.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 3 -i src/keys.mp4 -frames:v 1 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,eq=contrast=1.08:saturation=1.07:brightness=-0.05,drawbox=x=0:y=0:w=1280:h=720:color=black@0.13:t=fill,drawtext=fontfile=$F:text='765 / MO':fontcolor=white:fontsize=124:borderw=7:bordercolor=black:x=55:y=470" -q:v 2 out/thumb_B_765_MO.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 3 -i src/consult.mp4 -frames:v 1 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,eq=contrast=1.08:saturation=1.05:brightness=-0.06,drawbox=x=0:y=0:w=1280:h=720:color=black@0.15:t=fill,drawtext=fontfile=$F:text='PAYMENT TRAP':fontcolor=white:fontsize=105:borderw=7:bordercolor=black:x=55:y=480" -q:v 2 out/thumb_C_PAYMENT_TRAP.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: cost-normal-thumbnail-variants
          path: out/*.jpg
          retention-days: 7
